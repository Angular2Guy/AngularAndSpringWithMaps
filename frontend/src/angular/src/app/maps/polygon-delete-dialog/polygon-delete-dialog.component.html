@if (!isTestData) {
  <h1 mat-dialog-title i18n="@@DeleteDialog.Header">
    Delete Property
  </h1>
}
@if (isTestData) {
  <h1 mat-dialog-title i18n="@@DeleteDialog.Header.Testdata">
    Testdata can not be deleted
  </h1>
}
@if (!isTestData) {
  <div mat-dialog-content>
    <p i18n="@@DeleteDialog.Content">Do you want to delete this property?</p>
    <p>{{ data.polygonName }}</p>
  </div>
}
@if (isTestData) {
  <div mat-dialog-content>
    <p i18n="@@DeleteDialog.Content.Testdata">To return please click cancel.</p>
  </div>
}
<div mat-dialog-actions>
  <button
    mat-button
    (click)="cancelClick()"
    cdkFocusInitial
    i18n="@@DeleteDialog.Cancel"
  >
    Cancel
  </button>
  @if (!isTestData) {
    <button
      mat-button
      [mat-dialog-close]="dialogResults.delete"
      i18n="@@DeleteDialog.Delete"
    >
      Delete
    </button>
  }
</div>
